[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
url = "2"
launcher-protocol = { path = "crates/launcher-protocol" }
launcher-platform = { path = "crates/launcher-platform" }
launcher-plugin = { path = "crates/launcher-plugin" }
launcher-core = { path = "crates/launcher-core" }

