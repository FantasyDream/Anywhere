[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
url = "2"
anywhere-protocol = { path = "crates/anywhere-protocol" }
anywhere-platform = { path = "crates/anywhere-platform" }
anywhere-plugin = { path = "crates/anywhere-plugin" }
anywhere-core = { path = "crates/anywhere-core" }

