name: anywhere
description: Anywhere — context-aware macOS launcher. Presentation only.
publish_to: none
version: 0.14.0+46
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  cupertino_icons: 2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_rust_bridge: 2.13.0
  flutter_inappwebview: 6.1.5
  flutter_inappwebview_macos: 1.1.2
  material_ui: 1.8.0
  cupertino_ui: 1.1.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
