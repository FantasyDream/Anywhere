name: Cross-platform compilation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'apps/gpui/**'
      - 'resources/**'
      - 'scripts/**'
      - 'docs/windows.md'
      - 'LICENSE'
      - '.github/workflows/portable.yml'

permissions:
  contents: read

concurrency:
  group: portable-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0-beta.7
      - name: Verify builtin feature catalogue
        run: cargo run -p anywhere-core --example generate_feature_catalog --locked -- --check
      - name: Compile portable crates and test targets
        run: >-
          cargo check
          -p anywhere-core
          -p anywhere-platform
          -p anywhere-plugin
          -p anywhere-protocol
          --all-targets
          --locked
      - name: Run portable Rust regressions on Linux
        if: runner.os == 'Linux'
        run: >-
          cargo test
          -p anywhere-core
          -p anywhere-platform
          -p anywhere-plugin
          -p anywhere-protocol
          --locked

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0-beta.7
          components: clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check Windows GPUI and platform targets
        run: cargo clippy -p anywhere-gpui -p anywhere-platform --all-targets --locked -- -D warnings
      - name: Run shared Core, GPUI and Windows platform regressions
        run: cargo test -p anywhere-core -p anywhere-gpui -p anywhere-platform --lib --locked -- --test-threads=1
      - name: Run Windows MVP integration regressions
        run: cargo test -p anywhere-core --test mvp --locked -- --test-threads=1
      - name: Build Windows executable
        run: cargo build -p anywhere-gpui --release --target x86_64-pc-windows-msvc --locked
      - name: Package and checksum Windows executable
        run: python scripts/package-windows.py target/x86_64-pc-windows-msvc/release/anywhere-gpui.exe
      - uses: actions/upload-artifact@v7
        with:
          name: Anywhere-Windows-x64-${{ github.sha }}
          path: build/windows/Anywhere-windows-x64.zip*
          if-no-files-found: error
