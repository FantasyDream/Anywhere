name: macOS checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/flutter/**'
      - 'plugins/**'
      - 'packages/plugin-sdk/**'
      - 'resources/**'
      - 'LICENSE'
      - 'scripts/**'
      - '.flutter-version'
      - '.github/workflows/macos.yml'

permissions:
  contents: read

concurrency:
  group: macos-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Read Flutter version
        id: flutter-version
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Prepare macOS engine artifacts for native checks
        run: flutter --no-version-check precache --macos
      - name: Check Rust, native menus, architecture and Flutter
        run: ./scripts/check.sh
