name: Package Windows x64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/flutter/**'
      - 'plugins/**'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: windows-rust-${{ hashFiles('Cargo.lock') }}-
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Build and package (no tests)
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Context-Launcher-Windows-x64
          path: build/Context-Launcher-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
