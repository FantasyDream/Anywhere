name: Package Windows x64

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'apps/flutter/**'
      - 'plugins/**'
      - 'scripts/**'
      - '.flutter-version'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Read Flutter version
        id: flutter-version
        shell: bash
        run: echo "version=$(cat .flutter-version)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Check Rust, architecture and Flutter
        shell: bash
        run: ./scripts/check.sh

  package:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-rust-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: windows-rust-${{ hashFiles('Cargo.lock') }}-
      - name: Read Flutter version
        id: flutter-version
        shell: pwsh
        run: '"version=$(Get-Content .flutter-version -Raw | ForEach-Object { $_.Trim() })" >> $env:GITHUB_OUTPUT'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter-version.outputs.version }}
          channel: stable
          cache: true
      - name: Build and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Anywhere-Windows-x64
          path: build/Anywhere-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
