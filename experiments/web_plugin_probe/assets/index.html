<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src anywhere-plugin://probe.local; style-src 'unsafe-inline'; connect-src 'none'; frame-src 'none'; object-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, system-ui, sans-serif; color: #eee; }
    body { margin: 20px; background: transparent; }
    label { display: block; margin-bottom: 8px; }
    textarea { box-sizing: border-box; width: 100%; height: 130px; padding: 12px; border: 1px solid #666; border-radius: 8px; background: #252528; color: #fff; font: inherit; }
    button { margin-top: 12px; padding: 6px 16px; border: 1px solid #777; border-radius: 6px; color: #fff; background: #ffffff15; }
    output { display: block; margin-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
  <script src="anywhere-plugin://probe.local/probe.js" defer></script>
</head>
<body>
  <label for="input">Synthetic input · no clipboard or desktop access</label>
  <textarea id="input" placeholder="输入中文，检查输入法与编辑快捷键"></textarea>
  <button id="send">Echo through native bridge</button>
  <output id="result">Connecting…</output>
</body>
</html>
